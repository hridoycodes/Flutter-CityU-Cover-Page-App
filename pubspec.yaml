name: cityu_cover_page
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.12
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  hugeicons: ^0.0.11
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  open_file: ^3.5.10
  flutter_pdfview: ^1.4.1+1
  image_gallery_saver_plus: ^4.0.1
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.jpg"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/images/logo1.jpg"
  adaptive_icon_background: "#ffffff"